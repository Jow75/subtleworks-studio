<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Title, description, canonical and share tags below describe the home page.
      The build writes a copy of this file for every other route with that route's
      values (vite.config.ts), and usePageMeta keeps them current during in-app
      navigation. %SITE_URL% comes from src/data/siteMeta.ts.
    -->
    <title>SubtleWorks Studio — Precision Chrome Extensions | Baziq Hue</title>
    <meta name="description" content="SubtleWorks Studio is a Baziq Hue product studio building lightweight, hyper-focused Chrome extensions engineered to solve specific browser problems cleanly. Zero bloat, zero tracking, total control." />
    <meta name="keywords" content="Chrome extensions, Snap Flow Studio, full page screenshot, screenshot editor, smart-split PDF, Phantom Typer, human typing simulator, Invisible Selection, hide text highlight, clean copy paste, Universal Clipboard, browser productivity, developer tools, Baziq Hue, SubtleWorks Studio" />
    <meta name="author" content="SubtleWorks Studio • Baziq Hue" />
    <meta name="theme-color" content="#090D16" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SubtleWorks Studio" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="SubtleWorks Studio — Precision Chrome Extensions | Baziq Hue" />
    <meta property="og:description" content="SubtleWorks Studio is a Baziq Hue product studio building lightweight, hyper-focused Chrome extensions engineered to solve specific browser problems cleanly. Zero bloat, zero tracking, total control." />
    <meta property="og:image" content="%SITE_URL%/assets/extensions/phantom-typer/hero-preview.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SubtleWorks Studio — Precision Chrome Extensions | Baziq Hue" />
    <meta name="twitter:description" content="SubtleWorks Studio is a Baziq Hue product studio building lightweight, hyper-focused Chrome extensions engineered to solve specific browser problems cleanly. Zero bloat, zero tracking, total control." />
    <meta name="twitter:image" content="%SITE_URL%/assets/extensions/phantom-typer/hero-preview.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%SITE_URL%/#parent-organization",
          "name": "Baziq Hue",
          "url": "https://baziqhue.co.ke"
        },
        {
          "@type": "Organization",
          "@id": "%SITE_URL%/#organization",
          "name": "SubtleWorks Studio",
          "url": "%SITE_URL%/",
          "logo": "%SITE_URL%/favicon.svg",
          "email": "gmuraguri75@gmail.com",
          "parentOrganization": {
            "@id": "%SITE_URL%/#parent-organization"
          },
          "description": "SubtleWorks Studio is a Baziq Hue product studio crafting precision Chrome extensions with zero bloat and uncompromising privacy."
        },
        {
          "@type": "WebSite",
          "@id": "%SITE_URL%/#website",
          "url": "%SITE_URL%/",
          "name": "SubtleWorks Studio",
          "publisher": { "@id": "%SITE_URL%/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
