[build]
  command = "npm run build"
  publish = "dist"

# Routing rules are not listed here. The build writes dist/_redirects (per-route HTML,
# redirects from old product URLs, and a real 404 for unknown paths) from the page list
# in src/data/siteMeta.ts — see routeMetaPlugin in vite.config.ts.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
